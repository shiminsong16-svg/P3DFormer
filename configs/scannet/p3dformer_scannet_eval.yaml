test:
  seed: 1999

dataloader:
  test:
    batch_size: 1
    num_workers: 4
    persistent_workers: True

data:
  test:
    type: scannetv2
    data_root: data/scannetv2
    prefix: val
    suffix: _inst_nostuff.pth
    training: False
    mode: 4
    with_elastic: False
    use_xyz: True
    voxel_cfg:
      scale: 50
      spatial_shape: [128, 512]
      max_npoint: 250000

model:
  name: P3DFormer
  input_channel: 9
  blocks: 5
  block_reps: 2
  media: 32
  normalize_before: True
  return_blocks: True
  pool: max
  num_class: 18
  boundary_thresh: 0.5
  decoder:
    num_layer: 6
    num_query: 400
    d_model: 256
    nhead: 8
    hidden_dim: 1024
    dropout: 0.0
    activation_fn: gelu
    iter_pred: True
    attn_mask: True
    pe: False
    temperature: 10000
    pos_type: fourier
    attn_mask_thresh: 0.1
    quant_grid_length: 24
    grid_size: 0.1
    rel_query: True
    rel_key: True
    rel_value: True
  test_cfg:
    topk_insts: 400
    score_thr: 0.0
    npoint_thr: 100
  norm_eval: False
  fix_module: []
